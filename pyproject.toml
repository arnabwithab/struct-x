[project]
name = "structx"
version = "0.1.0"
description = "Physics-aware event vision for robust non-contact structural vibration monitoring"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "scipy",
  "pyyaml",
  "torchvision>=0.29.2",
  "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = ["pytest", "black", "ruff"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
